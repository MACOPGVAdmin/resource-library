<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Library</title>
<style>
@font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/dw5/Metropolis@1.1.0/Metropolis-Light.woff2') format('woff2'); font-weight: 300; }
@font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/dw5/Metropolis@1.1.0/Metropolis-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/dw5/Metropolis@1.1.0/Metropolis-Medium.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/dw5/Metropolis@1.1.0/Metropolis-SemiBold.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/dw5/Metropolis@1.1.0/Metropolis-Bold.woff2') format('woff2'); font-weight: 700; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --white: #FFFFFF; --forest: #00634E; --forest-dark: #004a3a; --forest-light: #e6f4f0;
  --cobalt: #2854CC; --cobalt-light: #eef2fd; --sky-light: #edfcfd;
  --gray-50: #f8f8f6; --gray-100: #eeede8; --gray-200: #d5d4cd;
  --gray-400: #9a9890; --gray-700: #3e3d38; --gray-900: #1a1a18;
  --r: 8px; --rs: 5px;
}
body { font-family: 'Metropolis', sans-serif; background: var(--white); color: var(--gray-900); font-size: 15px; line-height: 1.6; }

.lib-header { background: var(--forest); padding: 1.75rem 1.5rem 1.4rem; position: relative; overflow: hidden; }
.lib-header::before { content:''; position:absolute; top:-40px; right:-40px; width:180px; height:180px; border-radius:50%; background:rgba(124,233,240,0.13); }
.lib-header h1 { font-size:2.75rem; font-weight:700; color:var(--white); position:relative; z-index:1; }
.lib-header p { font-size:1.25rem; font-weight:300; color:rgba(255,255,255,0.75); margin-top:0.25rem; position:relative; z-index:1; }

.lib-controls { padding:1rem 1.5rem 0.75rem; border-bottom:1px solid var(--gray-100); background:var(--white); display:flex; flex-direction:column; gap:0.65rem; }
.search-row { display:flex; gap:0.5rem; align-items:center; }
.search-box { flex:1; padding:0.5rem 0.8rem; border:1px solid var(--gray-200); border-radius:var(--rs); font-family:'Metropolis',sans-serif; font-size:0.9rem; color:var(--gray-900); background:var(--gray-50); outline:none; }
.search-box:focus { border-color:var(--cobalt); background:var(--white); }
.type-toggle { display:flex; border:1px solid var(--gray-200); border-radius:var(--rs); overflow:hidden; }
.type-btn { padding:0.45rem 0.85rem; font-family:'Metropolis',sans-serif; font-size:0.8rem; font-weight:500; border:none; background:var(--white); color:var(--gray-400); cursor:pointer; white-space:nowrap; }
.type-btn.active { background:var(--forest); color:var(--white); }
.tag-select { padding:0.45rem 0.85rem; border:1px solid var(--gray-200); border-radius:var(--rs); background:var(--white); font-family:'Metropolis',sans-serif; font-size:0.82rem; font-weight:500; color:var(--gray-700); cursor:pointer; outline:none; }
.tag-select.has-active { border-color:var(--cobalt); color:var(--cobalt); background:var(--cobalt-light); }
.active-tags-row { display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.5rem; }
.active-chip { display:flex; align-items:center; gap:0.25rem; padding:0.18rem 0.35rem 0.18rem 0.6rem; border-radius:50px; font-size:0.73rem; font-weight:500; background:var(--cobalt-light); color:var(--cobalt); border:1.5px solid var(--cobalt); }
.active-chip-x { background:none; border:none; font-size:11px; color:var(--cobalt); cursor:pointer; padding:0 2px; font-family:'Metropolis',sans-serif; }

.lib-body { padding:0.9rem 1.5rem 1.5rem; }
.results-count { font-size:0.78rem; color:var(--gray-400); margin-bottom:0.75rem; }
.section-heading { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--gray-400); padding:0.5rem 0 0.35rem; margin-top:0.5rem; border-bottom:1px solid var(--gray-100); margin-bottom:0.6rem; }
.section-heading:first-child { margin-top:0; }
.resource-list { display:grid; grid-template-columns: repeat(2, 1fr); gap:0.75rem; }
.resource-list .section-heading { grid-column: 1 / -1; }

.resource-card { background:var(--white); border:1px solid var(--gray-100); border-radius:var(--r); padding:1rem; display:flex; flex-direction:column; gap:0.5rem; }
.card-row1 { display:flex; align-items:flex-start; justify-content:space-between; gap:0.5rem; }
.card-title { font-size:0.93rem; font-weight:600; color:var(--gray-900); line-height:1.3; flex:1; }
.card-type-label { font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:0.18rem 0.5rem; border-radius:50px; white-space:nowrap; flex-shrink:0; }
.label-pdf { background:var(--forest-light); color:var(--forest); }
.label-video { background:var(--cobalt-light); color:var(--cobalt); }
.card-tags { display:flex; flex-wrap:wrap; gap:0.25rem; }
.card-tag { font-size:0.65rem; font-weight:500; padding:0.1rem 0.4rem; border-radius:50px; background:var(--cobalt-light); color:var(--cobalt); }
.card-desc-text { font-size:0.82rem; color:var(--gray-700); line-height:1.55; }
.card-actions { display:flex; align-items:center; gap:0.4rem; margin-top:auto; padding-top:0.25rem; }
.btn-watch { font-size:0.78rem; font-weight:600; padding:0.35rem 0.8rem; border-radius:var(--rs); border:none; cursor:pointer; font-family:'Metropolis',sans-serif; background:var(--cobalt); color:var(--white); }
.btn-watch:hover { background:#1e3ea0; }
.btn-pdf { font-size:0.78rem; font-weight:600; padding:0.35rem 0.8rem; border-radius:var(--rs); text-decoration:none; font-family:'Metropolis',sans-serif; background:var(--forest); color:var(--white); display:inline-block; }
.btn-pdf:hover { background:var(--forest-dark); }
.card-desc { display:none; }
.card-desc.open { display:block; }

.video-wrap { display:none; margin-top:0.75rem; border-radius:var(--r); overflow:hidden; border:2px solid var(--cobalt); }
.video-wrap.open { display:block; }
.video-top { display:flex; align-items:center; justify-content:space-between; background:#111; padding:0.5rem 0.75rem; }
.video-top-title { font-size:0.82rem; font-weight:600; color:#fff; flex:1; margin-right:0.75rem; }
.video-x { background:rgba(255,255,255,0.15); border:none; border-radius:50%; width:26px; height:26px; color:#fff; font-size:0.9rem; cursor:pointer; font-family:'Metropolis',sans-serif; }
.video-ratio { position:relative; padding-bottom:56.25%; height:0; background:#000; }
.video-ratio iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
.video-fallback { padding:1rem; background:#1a1a1a; text-align:center; }
.video-fallback p { color:rgba(255,255,255,0.7); font-size:0.83rem; margin-bottom:0.6rem; }
.video-fallback a { color:#7CE9F0; font-weight:500; }

.empty-state { text-align:center; padding:2.5rem 1rem; color:var(--gray-400); }
.empty-state strong { display:block; font-size:1rem; font-weight:600; margin-bottom:0.3rem; color:var(--gray-700); }

.admin-footer { padding:0.4rem 1.5rem 0.75rem; text-align:right; }
.admin-trigger-btn { font-size:0.7rem; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--gray-200); background:none; border:none; cursor:pointer; font-family:'Metropolis',sans-serif; }
.admin-trigger-btn:hover { color:var(--gray-400); }

.admin-panel { display:none; border-top:2px solid var(--forest); background:var(--gray-50); padding:1.25rem 1.5rem 2rem; }
.admin-panel.open { display:block; }
.admin-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
.admin-bar h2 { font-size:1.1rem; font-weight:700; color:var(--forest); }
.admin-logout { font-size:0.78rem; font-weight:500; padding:0.3rem 0.7rem; border-radius:var(--rs); border:1px solid var(--gray-200); background:var(--white); color:var(--gray-700); cursor:pointer; font-family:'Metropolis',sans-serif; }

.login-box { max-width:320px; margin:0 auto; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--r); padding:1.5rem; }
.login-box h3 { font-size:1rem; font-weight:700; color:var(--forest); margin-bottom:1rem; }

.admin-tabs { display:flex; border-bottom:2px solid var(--gray-200); margin-bottom:1.25rem; }
.atab { padding:0.45rem 1rem; font-size:0.83rem; font-weight:500; background:none; border:none; color:var(--gray-400); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; font-family:'Metropolis',sans-serif; }
.atab.on { color:var(--forest); border-bottom-color:var(--forest); }
.asection { display:none; }
.asection.on { display:block; }

.aform { display:flex; flex-direction:column; gap:0.7rem; }
.arow { display:flex; gap:0.5rem; }
.arow .afield { flex:1; }
.afield { display:flex; flex-direction:column; gap:0.25rem; }
.alabel { font-size:0.73rem; font-weight:600; color:var(--gray-700); text-transform:uppercase; letter-spacing:0.04em; }
.ainput { padding:0.48rem 0.75rem; border:1px solid var(--gray-200); border-radius:var(--rs); font-family:'Metropolis',sans-serif; font-size:0.88rem; color:var(--gray-900); background:var(--white); outline:none; }
.ainput:focus { border-color:var(--cobalt); }
textarea.ainput { resize:vertical; min-height:60px; }
.tag-picker-grid { display:flex; flex-wrap:wrap; gap:0.3rem; padding:0.5rem 0.6rem; border:1px solid var(--gray-200); border-radius:var(--rs); background:var(--white); min-height:46px; }
.tpchip { padding:0.2rem 0.6rem; border-radius:50px; font-size:0.73rem; font-weight:500; cursor:pointer; background:var(--gray-100); color:var(--gray-700); border:1.5px solid transparent; user-select:none; }
.tpchip.on { background:var(--cobalt-light); border-color:var(--cobalt); color:var(--cobalt); }
.abtn-row { display:flex; gap:0.4rem; justify-content:flex-end; margin-top:0.25rem; }
.btn-p { padding:0.5rem 1.1rem; background:var(--forest); color:var(--white); border:none; border-radius:var(--rs); font-family:'Metropolis',sans-serif; font-size:0.85rem; font-weight:600; cursor:pointer; }
.btn-p:hover { background:var(--forest-dark); }
.btn-s { padding:0.5rem 1.1rem; background:var(--white); color:var(--gray-700); border:1px solid var(--gray-200); border-radius:var(--rs); font-family:'Metropolis',sans-serif; font-size:0.85rem; font-weight:500; cursor:pointer; }
.btn-d { padding:0.5rem 1rem; background:#fde8e8; color:#b91c1c; border:none; border-radius:var(--rs); font-family:'Metropolis',sans-serif; font-size:0.83rem; font-weight:500; cursor:pointer; }
.toast { display:none; font-size:0.8rem; font-weight:500; padding:0.4rem 0.75rem; border-radius:var(--rs); background:var(--forest-light); color:var(--forest); margin-top:0.4rem; }
.toast.err { background:#fde8e8; color:#b91c1c; }

.manage-list { display:flex; flex-direction:column; gap:0.4rem; margin-top:0.5rem; }
.mrow { display:flex; align-items:center; gap:0.5rem; padding:0.55rem 0.75rem; background:var(--white); border:1px solid var(--gray-100); border-radius:var(--rs); font-size:0.82rem; }
.mrow-title { flex:1; font-weight:500; color:var(--gray-900); }
.mtype { font-size:0.7rem; font-weight:600; padding:0.12rem 0.45rem; border-radius:50px; }
.mtype.pdf { background:var(--forest-light); color:var(--forest); }
.mtype.video { background:var(--cobalt-light); color:var(--cobalt); }
.medit-btn { font-size:0.78rem; font-weight:500; padding:0.25rem 0.6rem; border-radius:var(--rs); border:1px solid var(--cobalt); color:var(--cobalt); background:none; cursor:pointer; font-family:'Metropolis',sans-serif; }
.edit-box { display:none; margin-top:0.35rem; padding:1rem; border:2px solid var(--cobalt); border-radius:var(--r); background:var(--white); }
.edit-box.open { display:block; }
.edit-box-title { font-size:0.78rem; font-weight:700; color:var(--cobalt); margin-bottom:0.75rem; text-transform:uppercase; letter-spacing:0.04em; }

.add-tag-row { display:flex; gap:0.5rem; margin-bottom:0.75rem; }
.add-tag-row .ainput { flex:1; }
.tags-grid { display:flex; flex-wrap:wrap; gap:0.35rem; }
.tagitem { display:flex; align-items:center; gap:0.3rem; background:var(--sky-light); border:1px solid #b3eef2; border-radius:50px; padding:0.2rem 0.35rem 0.2rem 0.65rem; font-size:0.76rem; font-weight:500; color:#0a7a80; }
.tagdel { background:rgba(0,0,0,0.1); border:none; border-radius:50%; width:16px; height:16px; font-size:9px; cursor:pointer; color:#0a7a80; font-family:'Metropolis',sans-serif; }
</style>
</head>
<body>

<div class="lib-header">
  <h1>Resource Library</h1>
  <p>Fact sheets and webinars on gun violence prevention</p>
</div>

<div class="lib-controls">
  <div class="search-row">
    <input class="search-box" id="search" type="text" placeholder="Search resources…" oninput="render()">
    <div class="type-toggle">
      <button class="type-btn active" onclick="setType('all',this)">All</button>
      <button class="type-btn" onclick="setType('pdf',this)">Fact Sheets</button>
      <button class="type-btn" onclick="setType('video',this)">Webinars</button>
    </div>
  </div>
  <div>
    <select class="tag-select" id="tag-select" onchange="selectTag(this.value)">
      <option value="">Filter by topic…</option>
    </select>
    <div class="active-tags-row" id="active-chips"></div>
  </div>
</div>

<div class="lib-body">
  <div class="results-count" id="count"></div>
  <div class="resource-list" id="res-list"></div>
</div>

<div class="admin-footer">
  <button class="admin-trigger-btn" onclick="showLogin()">Admin</button>
</div>

<div class="admin-panel" id="admin-panel">
  <div class="admin-bar">
    <h2>Admin Panel</h2>
    <button class="admin-logout" onclick="logout()">Sign Out</button>
  </div>
  <div id="login-section">
    <div class="login-box">
      <h3>Enter Admin Password</h3>
      <div class="afield" style="margin-bottom:0.65rem">
        <label class="alabel">Password</label>
        <input class="ainput" type="password" id="pw-input" placeholder="Password…" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="toast err" id="login-err">Incorrect password.</div>
      <div style="margin-top:0.65rem">
        <button class="btn-p" style="width:100%" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>
  <div id="admin-content" style="display:none">
    <div class="admin-tabs">
      <button class="atab on" onclick="atab('add',this)">Add Resource</button>
      <button class="atab" onclick="atab('manage',this)">Manage Resources</button>
      <button class="atab" onclick="atab('tags',this)">Manage Tags</button>
    </div>
    <div class="asection on" id="sec-add">
      <div class="aform">
        <div class="afield"><label class="alabel">Title *</label><input class="ainput" id="a-title" type="text" placeholder="Resource title"></div>
        <div class="arow">
          <div class="afield"><label class="alabel">Type *</label>
            <select class="ainput" id="a-type"><option value="pdf">Fact Sheet (PDF)</option><option value="video">Webinar (YouTube)</option></select>
          </div>
          <div class="afield"><label class="alabel">URL *</label><input class="ainput" id="a-url" type="text" placeholder="https://…"></div>
        </div>
        <div class="afield"><label class="alabel">Description</label><textarea class="ainput" id="a-desc" placeholder="Brief description (optional)"></textarea></div>
        <div class="afield"><label class="alabel">Topic Tags</label><div class="tag-picker-grid" id="a-tags"></div></div>
        <div class="abtn-row">
          <button class="btn-s" onclick="clearAdd()">Clear</button>
          <button class="btn-p" onclick="addResource()">Add Resource</button>
        </div>
        <div class="toast" id="add-toast">Resource added!</div>
      </div>
    </div>
    <div class="asection" id="sec-manage">
      <p style="font-size:0.8rem;color:var(--gray-400);margin-bottom:0.65rem">Click Edit on any resource to update or delete it.</p>
      <div class="manage-list" id="manage-list"></div>
    </div>
    <div class="asection" id="sec-tags">
      <div class="add-tag-row">
        <input class="ainput" id="new-tag" type="text" placeholder="New tag name…" onkeydown="if(event.key==='Enter')addTag()">
        <button class="btn-p" onclick="addTag()">Add Tag</button>
      </div>
      <div class="alabel" style="margin-bottom:0.4rem">Current Tags</div>
      <div class="tags-grid" id="tags-grid"></div>
      <div class="toast" id="tag-toast" style="margin-top:0.5rem">Tag saved!</div>
    </div>
  </div>
</div>

<script>
var PW = 'gvpc2024';

var tags = ['domestic violence','community violence','mass shootings','Emergency Response Orders','police shootings','immigration','suicide','firearm industry','youth','survivors','schools','policy','healthcare'];

var resources = [
  {id:1,  title:'About the Coalition', type:'pdf', url:'#', tags:['policy'], desc:'Learn about our organization, our mission, and our work to prevent gun violence across Massachusetts.'},
  {id:2,  title:'Gun Violence in Massachusetts 101', type:'pdf', url:'#', tags:['policy','community violence'], desc:'An overview of gun violence in Massachusetts, covering key statistics, trends, and the policy landscape.'},
  {id:3,  title:'Guns and Community Violence', type:'pdf', url:'#', tags:['community violence'], desc:'Focuses on everyday gun violence in communities and intervention strategies that work.'},
  {id:4,  title:'Guns and Domestic Violence', type:'pdf', url:'#', tags:['domestic violence'], desc:'Examines how firearms elevate the danger in domestic violence situations and what laws can help.'},
  {id:5,  title:'Guns and Emergency Response Orders', type:'pdf', url:'#', tags:['Emergency Response Orders','policy'], desc:'An explanation of Extreme Risk Protection Orders (ERPOs) and how they are used in Massachusetts.'},
  {id:6,  title:'Guns and Mass Shootings', type:'pdf', url:'#', tags:['mass shootings','policy'], desc:'Reviews the data on mass shootings in the US, common factors, and evidence-based policy responses.'},
  {id:7,  title:'Guns and Police Shootings', type:'pdf', url:'#', tags:['police shootings'], desc:'Analyzes police use-of-force incidents involving firearms and the systemic factors involved.'},
  {id:8,  title:'Guns and Suicide', type:'pdf', url:'#', tags:['suicide'], desc:'Explores the connection between firearm access and suicide risk, with data and prevention strategies.'},
  {id:9,  title:'The Impact of Guns on Businesses in Massachusetts', type:'pdf', url:'#', tags:['policy','community violence'], desc:'Looks at the economic cost of gun violence on businesses and local economies.'},
  {id:10, title:'The Impact of Guns on Healthcare in Massachusetts', type:'pdf', url:'#', tags:['healthcare'], desc:'Documents the toll gun violence takes on the healthcare system and providers in Massachusetts.'},
  {id:11, title:'The Impact of Guns on Schools in Massachusetts', type:'pdf', url:'#', tags:['schools','youth'], desc:'Examines how gun violence affects educational environments and students across the state.'},
  {id:12, title:'The Intersection of Gun Violence, Immigration and Federal Agencies', type:'pdf', url:'#', tags:['immigration','policy'], desc:'Explores the relationship between immigration enforcement, federal agencies, and gun violence.'},
  {id:13, title:'Bridging Healthcare and Safety: An Extreme Risk Protection Order Overview', type:'video', url:'#', tags:['healthcare','Emergency Response Orders'], desc:'Healthcare providers and legal experts discuss the role of ERPOs in preventing gun violence.'},
  {id:14, title:'Effects of a Hospital Based Violence Intervention Program on Community Violence', type:'video', url:'#', tags:['healthcare','community violence','survivors'], desc:'Research on how hospital-based intervention programs reduce community violence and recidivism.'},
  {id:15, title:'Firearm Industry Accountability', type:'video', url:'#', tags:['firearm industry','policy'], desc:'A webinar on holding the gun industry legally and financially accountable for harm caused by its products.'},
  {id:16, title:'Firearms and Family Violence', type:'video', url:'#', tags:['domestic violence'], desc:'Discusses how firearm access within families increases risks of lethal domestic and family violence.'},
  {id:17, title:'Focusing on Educators: A Conversation with Teachers Unify', type:'video', url:'#', tags:['schools','youth'], desc:'Teachers discuss gun violence impact on education and their advocacy efforts with Teachers Unify.'},
  {id:18, title:'Focusing on Survivors: A Conversation with the Louis D Brown Peace Institute', type:'video', url:'#', tags:['survivors','community violence'], desc:'Centering the voices of survivors, this webinar highlights the work of the Louis D Brown Peace Institute.'},
  {id:19, title:'How Guns Fuel Violence Abroad and Drive Migration', type:'video', url:'#', tags:['immigration','community violence'], desc:'Explores the global arms pipeline and how US-sourced guns contribute to violence and forced migration.'},
  {id:20, title:'ICE and Gun Violence in Massachusetts', type:'video', url:'#', tags:['immigration','police shootings'], desc:'Explores the intersection of federal immigration enforcement and gun violence in Massachusetts.'},
  {id:21, title:'The Community Violence Intervention Action Plan', type:'video', url:'#', tags:['community violence','policy'], desc:'Presents a comprehensive action plan for community-based violence intervention and prevention.'},
  {id:22, title:'The Former White House Office of Gun Violence Prevention', type:'video', url:'#', tags:['policy'], desc:'An inside look at the work and priorities of the White House Office of Gun Violence Prevention.'},
  {id:23, title:'The Intersection of Domestic Violence and Community Violence', type:'video', url:'#', tags:['domestic violence','community violence'], desc:'Examines the overlap between intimate partner violence and broader community violence patterns.'},
  {id:24, title:'The Intersection of Guns and Domestic Violence', type:'video', url:'#', tags:['domestic violence'], desc:'Experts discuss how firearms increase lethality in domestic violence and what policies can help.'},
  {id:25, title:'The Raise the Age Bill - A Conversation with Citizens for Juvenile Justice', type:'video', url:'#', tags:['youth','policy'], desc:'A discussion on raising the age of juvenile justice jurisdiction and its connection to youth gun violence.'},
  {id:26, title:'Why Young People Carry Guns', type:'video', url:'#', tags:['youth','community violence'], desc:'A conversation examining the social and environmental factors that lead young people to carry firearms.'}
];

var nextId = 27;
var activeType = 'all';
var activeTags = [];
var loggedIn = false;

// ── YOUTUBE HELPER ──
function getYouTubeId(url) {
  if (!url) return null;
  var r1 = url.match(/youtube\.com\/watch\?v=([^&]+)/);
  if (r1) return r1[1];
  var r2 = url.match(/youtu\.be\/([^?&]+)/);
  if (r2) return r2[1];
  var r3 = url.match(/youtube\.com\/embed\/([^?&]+)/);
  if (r3) return r3[1];
  return null;
}

// ── VIDEO PLAYER ──
function watchVideo(id) {
  var r = null;
  for (var i = 0; i < resources.length; i++) {
    if (resources[i].id === id) { r = resources[i]; break; }
  }
  if (!r) return;
  if (!r.url || r.url === '#') { alert('URL not set for this resource yet.'); return; }

  // close any open player
  var open = document.querySelectorAll('.video-wrap.open');
  for (var j = 0; j < open.length; j++) {
    open[j].classList.remove('open');
    var oldRatio = open[j].querySelector('.video-ratio');
    if (oldRatio) oldRatio.innerHTML = '';
  }

  var wrap = document.getElementById('vw-' + id);
  if (!wrap) return;

  var vid = getYouTubeId(r.url);
  var ratio = document.getElementById('vr-' + id);
  var fallback = document.getElementById('vf-' + id);

  if (vid) {
    ratio.style.display = 'block';
    fallback.style.display = 'none';
    ratio.innerHTML = '<iframe src="https://www.youtube.com/embed/' + vid + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  } else {
    ratio.style.display = 'none';
    fallback.style.display = 'block';
  }

  wrap.classList.add('open');
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeVideo(id) {
  var wrap = document.getElementById('vw-' + id);
  if (!wrap) return;
  wrap.classList.remove('open');
  var ratio = document.getElementById('vr-' + id);
  if (ratio) ratio.innerHTML = '';
}

// ── RENDER ──
function buildCard(r) {
  var v = r.type === 'video';
  var hasDesc = r.desc && r.desc.trim() !== '';

  var tagsHtml = '';
  for (var i = 0; i < r.tags.length; i++) {
    tagsHtml += '<span class="card-tag">' + r.tags[i] + '</span>';
  }

  var actionHtml = '';
  if (v) {
    actionHtml = '<button class="btn-watch" onclick="watchVideo(' + r.id + ')">Watch Webinar</button>';
  } else {
    actionHtml = '<a class="btn-pdf" href="' + r.url + '" target="_top">View PDF</a>';
  }

  var descHtml = '';

  var videoHtml = '';
  if (v) {
    videoHtml = '<div class="video-wrap" id="vw-' + r.id + '">' +
      '<div class="video-top">' +
        '<div class="video-top-title">' + r.title + '</div>' +
        '<button class="video-x" onclick="closeVideo(' + r.id + ')">&#10005;</button>' +
      '</div>' +
      '<div class="video-ratio" id="vr-' + r.id + '"></div>' +
      '<div class="video-fallback" id="vf-' + r.id + '" style="display:none">' +
        '<p>This video cannot be embedded.</p>' +
        '<a href="' + r.url + '" target="_top">Watch on YouTube &rarr;</a>' +
      '</div>' +
    '</div>';
  }

  var descText = hasDesc ? '<div class="card-desc-text">' + r.desc + '</div>' : '';
  return '<div class="resource-card">' +
    '<div class="card-row1">' +
      '<div class="card-title">' + r.title + '</div>' +
      '<span class="card-type-label ' + (v ? 'label-video' : 'label-pdf') + '">' + (v ? 'Webinar' : 'Fact Sheet') + '</span>' +
    '</div>' +
    '<div class="card-tags">' + tagsHtml + '</div>' +
    descText +
    '<div class="card-actions">' + actionHtml + '</div>' +
    videoHtml +
  '</div>';
}

function render() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var filtered = [];
  for (var i = 0; i < resources.length; i++) {
    var r = resources[i];
    var tOk = activeType === 'all' || r.type === activeType;
    var gOk = activeTags.length === 0;
    if (!gOk) {
      gOk = true;
      for (var j = 0; j < activeTags.length; j++) {
        if (r.tags.indexOf(activeTags[j]) === -1) { gOk = false; break; }
      }
    }
    var sOk = !q || r.title.toLowerCase().indexOf(q) !== -1 || (r.desc && r.desc.toLowerCase().indexOf(q) !== -1);
    if (!sOk) {
      for (var k = 0; k < r.tags.length; k++) {
        if (r.tags[k].toLowerCase().indexOf(q) !== -1) { sOk = true; break; }
      }
    }
    if (tOk && gOk && sOk) filtered.push(r);
  }

  filtered.sort(function(a,b){ return a.title.localeCompare(b.title); });

  var pdfs = [], videos = [];
  for (var i = 0; i < filtered.length; i++) {
    if (filtered[i].type === 'pdf') pdfs.push(filtered[i]);
    else videos.push(filtered[i]);
  }

  var countEl = document.getElementById('count');
  countEl.textContent = filtered.length === resources.length
    ? resources.length + ' resources'
    : filtered.length + ' of ' + resources.length + ' resources';

  var el = document.getElementById('res-list');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><strong>No resources found</strong>Try adjusting your filters or search.</div>';
    return;
  }

  var html = '';
  if (activeType === 'pdf') {
    for (var i = 0; i < pdfs.length; i++) html += buildCard(pdfs[i]);
  } else if (activeType === 'video') {
    for (var i = 0; i < videos.length; i++) html += buildCard(videos[i]);
  } else {
    if (pdfs.length) {
      html += '<div class="section-heading">Fact Sheets</div>';
      for (var i = 0; i < pdfs.length; i++) html += buildCard(pdfs[i]);
    }
    if (videos.length) {
      html += '<div class="section-heading">Webinars</div>';
      for (var i = 0; i < videos.length; i++) html += buildCard(videos[i]);
    }
  }
  el.innerHTML = html;
}

function toggleDesc(id, btn) {
  var el = document.getElementById('desc-' + id);
  if (!el) return;
  var open = el.classList.toggle('open');
  btn.innerHTML = open ? 'About &#9650;' : 'About &#9660;';
}

function setType(type, btn) {
  activeType = type;
  var btns = document.querySelectorAll('.type-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  render();
}

// ── TAG FILTER ──
function renderTagSelect() {
  var sel = document.getElementById('tag-select');
  if (!sel) return;
  sel.innerHTML = '<option value="">Filter by topic\u2026</option>';
  for (var i = 0; i < tags.length; i++) {
    var opt = document.createElement('option');
    opt.value = tags[i];
    opt.textContent = (activeTags.indexOf(tags[i]) !== -1 ? '\u2713 ' : '') + tags[i];
    sel.appendChild(opt);
  }
  sel.value = '';
  sel.className = 'tag-select' + (activeTags.length ? ' has-active' : '');

  var chips = document.getElementById('active-chips');
  chips.innerHTML = '';
  for (var i = 0; i < activeTags.length; i++) {
    var span = document.createElement('span');
    span.className = 'active-chip';
    span.innerHTML = activeTags[i] + '<button class="active-chip-x" onclick="removeActiveTag(\'' + activeTags[i].replace(/'/g,"\\'") + '\')">&#10005;</button>';
    chips.appendChild(span);
  }
}

function selectTag(val) {
  if (!val) return;
  if (activeTags.indexOf(val) === -1) activeTags.push(val);
  renderTagSelect();
  render();
}

function removeActiveTag(t) {
  activeTags = activeTags.filter(function(x){ return x !== t; });
  renderTagSelect();
  render();
}

// ── LOGIN ──
function showLogin() {
  var p = document.getElementById('admin-panel');
  p.classList.toggle('open');
  if (p.classList.contains('open') && !loggedIn) {
    p.scrollIntoView({behavior:'smooth'});
    setTimeout(function(){ document.getElementById('pw-input').focus(); }, 100);
  }
}

function doLogin() {
  var val = document.getElementById('pw-input').value;
  var err = document.getElementById('login-err');
  if (val === PW) {
    loggedIn = true;
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderAdminAll();
  } else {
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    setTimeout(function(){ err.style.display='none'; }, 2500);
  }
}

function logout() {
  loggedIn = false;
  document.getElementById('pw-input').value = '';
  document.getElementById('admin-content').style.display = 'none';
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('admin-panel').classList.remove('open');
}

// ── ADMIN TABS ──
function atab(name, btn) {
  var sections = document.querySelectorAll('.asection');
  for (var i = 0; i < sections.length; i++) sections[i].classList.remove('on');
  var tabs = document.querySelectorAll('.atab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  document.getElementById('sec-' + name).classList.add('on');
  btn.classList.add('on');
}

function renderAdminAll() { renderAddPicker(); renderManageList(); renderTagsGrid(); }

function buildPicker(cid, selected) {
  var el = document.getElementById(cid);
  if (!el) return;
  el.innerHTML = '';
  for (var i = 0; i < tags.length; i++) {
    var chip = document.createElement('span');
    chip.className = 'tpchip' + (selected.indexOf(tags[i]) !== -1 ? ' on' : '');
    chip.textContent = tags[i];
    chip.onclick = function(){ this.classList.toggle('on'); };
    el.appendChild(chip);
  }
}

function getPickerTags(cid) {
  var result = [];
  var chips = document.querySelectorAll('#' + cid + ' .tpchip.on');
  for (var i = 0; i < chips.length; i++) result.push(chips[i].textContent);
  return result;
}

function renderAddPicker() { buildPicker('a-tags', []); }

function clearAdd() {
  document.getElementById('a-title').value = '';
  document.getElementById('a-url').value = '';
  document.getElementById('a-desc').value = '';
  document.getElementById('a-type').value = 'pdf';
  renderAddPicker();
}

function addResource() {
  var title = document.getElementById('a-title').value.trim();
  var url = document.getElementById('a-url').value.trim();
  if (!title || !url) { alert('Please enter a title and URL.'); return; }
  resources.push({
    id: nextId++,
    title: title,
    type: document.getElementById('a-type').value,
    url: url,
    tags: getPickerTags('a-tags'),
    desc: document.getElementById('a-desc').value.trim()
  });
  clearAdd(); render(); renderManageList();
  var t = document.getElementById('add-toast');
  t.style.display = 'block';
  setTimeout(function(){ t.style.display='none'; }, 2000);
}

function renderManageList() {
  var el = document.getElementById('manage-list');
  if (!el) return;
  if (!resources.length) { el.innerHTML = '<p style="font-size:0.82rem;color:var(--gray-400)">No resources yet.</p>'; return; }
  el.innerHTML = '';
  for (var i = 0; i < resources.length; i++) {
    var r = resources[i];
    var row = document.createElement('div');
    row.innerHTML =
      '<div class="mrow">' +
        '<span class="mtype ' + r.type + '">' + (r.type==='pdf'?'PDF':'Video') + '</span>' +
        '<span class="mrow-title">' + r.title + '</span>' +
        '<button class="medit-btn" onclick="openEdit(' + r.id + ')">Edit</button>' +
      '</div>' +
      '<div class="edit-box" id="edit-' + r.id + '">' +
        '<div class="edit-box-title">Editing resource</div>' +
        '<div class="aform">' +
          '<div class="afield"><label class="alabel">Title *</label><input class="ainput" id="et-title-' + r.id + '" value="' + r.title.replace(/"/g,'&quot;') + '"></div>' +
          '<div class="arow">' +
            '<div class="afield"><label class="alabel">Type</label><select class="ainput" id="et-type-' + r.id + '"><option value="pdf"' + (r.type==='pdf'?' selected':'') + '>Fact Sheet (PDF)</option><option value="video"' + (r.type==='video'?' selected':'') + '>Webinar (YouTube)</option></select></div>' +
            '<div class="afield"><label class="alabel">URL</label><input class="ainput" id="et-url-' + r.id + '" value="' + r.url.replace(/"/g,'&quot;') + '"></div>' +
          '</div>' +
          '<div class="afield"><label class="alabel">Description</label><textarea class="ainput" id="et-desc-' + r.id + '">' + (r.desc||'') + '</textarea></div>' +
          '<div class="afield"><label class="alabel">Topic Tags</label><div class="tag-picker-grid" id="et-tags-' + r.id + '"></div></div>' +
          '<div class="abtn-row">' +
            '<button class="btn-d" onclick="deleteRes(' + r.id + ')">Delete</button>' +
            '<button class="btn-s" onclick="closeEdit(' + r.id + ')">Cancel</button>' +
            '<button class="btn-p" onclick="saveEdit(' + r.id + ')">Save Changes</button>' +
          '</div>' +
          '<div class="toast" id="et-toast-' + r.id + '">Saved!</div>' +
        '</div>' +
      '</div>';
    el.appendChild(row);
  }
}

function openEdit(id) {
  var boxes = document.querySelectorAll('.edit-box.open');
  for (var i = 0; i < boxes.length; i++) boxes[i].classList.remove('open');
  var box = document.getElementById('edit-' + id);
  box.classList.add('open');
  var r = null;
  for (var i = 0; i < resources.length; i++) { if (resources[i].id === id) { r = resources[i]; break; } }
  buildPicker('et-tags-' + id, r ? r.tags : []);
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function closeEdit(id) {
  var box = document.getElementById('edit-' + id);
  if (box) box.classList.remove('open');
}

function saveEdit(id) {
  var r = null;
  for (var i = 0; i < resources.length; i++) { if (resources[i].id === id) { r = resources[i]; break; } }
  if (!r) return;
  r.title = document.getElementById('et-title-' + id).value.trim();
  r.type  = document.getElementById('et-type-' + id).value;
  r.url   = document.getElementById('et-url-' + id).value.trim();
  r.desc  = document.getElementById('et-desc-' + id).value.trim();
  r.tags  = getPickerTags('et-tags-' + id);
  render(); renderManageList();
  var t = document.getElementById('et-toast-' + id);
  if (t) { t.style.display='block'; setTimeout(function(){ t.style.display='none'; closeEdit(id); }, 1200); }
}

function deleteRes(id) {
  if (!confirm('Delete this resource? This cannot be undone.')) return;
  resources = resources.filter(function(r){ return r.id !== id; });
  render(); renderManageList();
}

function renderTagsGrid() {
  var el = document.getElementById('tags-grid');
  if (!el) return;
  el.innerHTML = '';
  for (var i = 0; i < tags.length; i++) {
    var item = document.createElement('div');
    item.className = 'tagitem';
    item.innerHTML = tags[i] + '<button class="tagdel" onclick="removeTag(' + JSON.stringify(tags[i]) + ')">&#10005;</button>';
    el.appendChild(item);
  }
}

function addTag() {
  var input = document.getElementById('new-tag');
  var val = input.value.trim();
  if (!val || tags.indexOf(val) !== -1) { input.value=''; return; }
  tags.push(val);
  input.value = '';
  renderTagsGrid(); renderTagSelect(); renderAddPicker(); renderManageList();
  var t = document.getElementById('tag-toast');
  t.style.display='block'; setTimeout(function(){ t.style.display='none'; }, 1500);
}

function removeTag(tag) {
  if (!confirm('Remove tag "' + tag + '"? It will be removed from all resources.')) return;
  tags = tags.filter(function(t){ return t !== tag; });
  for (var i = 0; i < resources.length; i++) {
    resources[i].tags = resources[i].tags.filter(function(t){ return t !== tag; });
  }
  activeTags = activeTags.filter(function(t){ return t !== tag; });
  renderTagsGrid(); renderTagSelect(); render(); renderAddPicker(); renderManageList();
}

// ── INIT ──
renderTagSelect();
render();
</script>
</body>
</html>
