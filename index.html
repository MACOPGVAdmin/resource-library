<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Library</title>
<style>
  @font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/nicholasgasior/metropolis@latest/fonts/Metropolis-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/nicholasgasior/metropolis@latest/fonts/Metropolis-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; }
  @font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/nicholasgasior/metropolis@latest/fonts/Metropolis-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; }
  @font-face { font-family: 'Metropolis'; src: url('https://cdn.jsdelivr.net/gh/nicholasgasior/metropolis@latest/fonts/Metropolis-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; }
</style>
<style>
  :root {
    --white: #FFFFFF;
    --green: #00634E;
    --blue: #2854CC;
    --cyan: #7CE9F0;
    --pink: #FFBDF3;
    --light-bg: #f5f7fa;
    --border: #e0e4ed;
    --text: #1a1a2e;
    --muted: #6b7280;
    --tag-bg: #eef2ff;
    --tag-color: #2854CC;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Metropolis', sans-serif;
    background: var(--light-bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--green);
    color: #fff;
    padding: 28px 32px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .header h1 {
    font-family: 'Metropolis', sans-serif;
    font-size: 38px;
    font-weight: 400;
    letter-spacing: -0.5px;
  }
  .header p { font-size: 16px; opacity: .75; margin-top: 6px; }
  #admin-tab-trigger {
    position: fixed;
    bottom: -38px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: rgba(255,255,255,0.5);
    font-size: 18px;
    width: 48px;
    height: 56px;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 7px;
    cursor: pointer;
    box-shadow: 0 -2px 10px rgba(0,0,0,.15);
    transition: bottom .3s ease, color .2s;
    z-index: 500;
    user-select: none;
  }
  #admin-tab-trigger:hover {
    bottom: 0;
    color: #fff;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input[type="text"] {
    flex: 1; min-width: 200px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: 'Metropolis', sans-serif;
    outline: none;
    transition: border-color .2s;
  }
  .filter-bar input[type="text"]:focus { border-color: var(--blue); }

  .type-filter {
    display: flex;
    gap: 6px;
  }
  .type-btn {
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    font-family: 'Metropolis', sans-serif;
    cursor: pointer;
    color: var(--muted);
    transition: all .15s;
  }
  .type-btn.active { background: var(--green); color: #fff; border-color: var(--green); }

  /* ── CUSTOM TOPIC DROPDOWN ── */
  .topic-dropdown-wrap { position: relative; }
  .topic-dropdown-btn {
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    font-size: 14px;
    font-family: 'Metropolis', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 180px;
    justify-content: space-between;
    transition: border-color .2s;
    user-select: none;
  }
  .topic-dropdown-btn:hover, .topic-dropdown-btn.open { border-color: var(--blue); }
  .topic-dropdown-btn .arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
  .topic-dropdown-btn.open .arrow { transform: rotate(180deg); }
  .topic-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    min-width: 220px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 9px;
    box-shadow: 0 8px 24px rgba(0,0,0,.1);
    z-index: 100;
    padding: 8px;
    max-height: 320px;
    overflow-y: auto;
  }
  .topic-dropdown-menu.open { display: block; }
  .topic-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    transition: background .15s;
  }
  .topic-option:hover { background: var(--tag-bg); }
  .topic-option input[type="checkbox"] { accent-color: var(--blue); width: 15px; height: 15px; cursor: pointer; }
  .topic-option.selected { color: var(--blue); font-weight: 500; }
  .dd-clear {
    display: block;
    width: 100%;
    text-align: center;
    padding: 7px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 6px;
    cursor: pointer;
    border-radius: 0 0 6px 6px;
    transition: background .15s;
  }
  .dd-clear:hover { background: #fafafa; color: var(--text); }

  /* ── GRID ── */
  .grid-wrap { padding: 24px 32px; }
  .results-count { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow .2s, transform .2s;
  }
  .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.08); transform: translateY(-1px); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--text); }
  .card-type {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .type-factsheet { background: #e8f5e9; color: #2e7d32; }
  .type-webinar   { background: #e3f2fd; color: #1565c0; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11.5px;
    background: var(--tag-bg);
    color: var(--tag-color);
    padding: 3px 9px;
    border-radius: 20px;
    cursor: pointer;
    transition: background .15s;
  }
  .tag:hover { background: #dce5ff; }
  .card-desc-wrap { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .card-desc-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-desc-text.expanded { display: block; }
  .expand-btn {
    font-size: 12px;
    color: var(--blue);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    margin-top: 3px;
    font-family: 'Metropolis', sans-serif;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    margin-top: 2px;
    transition: opacity .15s;
    width: fit-content;
    font-family: 'Metropolis', sans-serif;
  }
  .card-link:hover { opacity: .85; }
  .pdf-l { background: var(--green); color: #fff; }
  .vid-l { background: var(--blue); color: #fff; }
  .no-link { background: #e5e7eb; color: var(--muted); cursor: default; pointer-events: none; }
  .card-url-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f5f7fa;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .card-url-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .card-url {
    font-size: 12px;
    color: var(--blue);
    word-break: break-all;
    flex: 1;
    text-decoration: none;
  }
  .card-url:hover { text-decoration: underline; }
  .copy-btn {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Metropolis', sans-serif;
    white-space: nowrap;
    transition: background .2s;
  }
  .copy-btn:hover { background: #004d3c; }
  .copy-btn.copied { background: #2854CC; }
  .empty-state h3 { font-size: 17px; margin-bottom: 6px; color: var(--text); }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 1000;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    width: 100%; max-width: 680px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal-head {
    background: var(--green);
    color: #fff;
    padding: 20px 24px;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-head h2 { font-family: 'Metropolis', sans-serif; font-weight: 400; font-size: 20px; }
  .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-body { padding: 24px; }

  /* ── LOGIN ── */
  .login-box { max-width: 360px; margin: 0 auto; text-align: center; }
  .login-box p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
  .login-box input {
    width: 100%; padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Metropolis', sans-serif;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .2s;
  }
  .login-box input:focus { border-color: var(--green); }
  .login-err { color: #dc2626; font-size: 13px; margin-bottom: 8px; min-height: 18px; }
  .btn-primary {
    background: var(--green); color: #fff;
    border: none; padding: 11px 24px;
    border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer;
    font-family: 'Metropolis', sans-serif;
    width: 100%;
    transition: background .2s;
  }
  .btn-primary:hover { background: #004d3c; }

  /* ── ADMIN PANEL ── */
  .admin-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .admin-tab {
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: 'Metropolis', sans-serif;
    background: none; border-top: none; border-left: none; border-right: none;
    transition: color .15s;
  }
  .admin-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }

  .admin-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--text); }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
  .form-row input[type="text"],
  .form-row input[type="url"],
  .form-row textarea,
  .form-row select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: 'Metropolis', sans-serif;
    outline: none;
    transition: border-color .2s;
    background: #fff;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--green); }
  .form-row textarea { resize: vertical; min-height: 70px; }

  /* Admin topic multi-select dropdown */
  .admin-topic-dd-wrap { position: relative; }
  .admin-topic-dd-btn {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: 'Metropolis', sans-serif;
    cursor: pointer;
    display: flex; align-items: center;
    justify-content: space-between;
    background: #fff;
    transition: border-color .2s;
    user-select: none;
  }
  .admin-topic-dd-btn:hover, .admin-topic-dd-btn.open { border-color: var(--green); }
  .admin-topic-dd-menu {
    display: none;
    position: absolute; top: calc(100% + 3px); left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.1);
    z-index: 200;
    padding: 6px;
    max-height: 240px; overflow-y: auto;
  }
  .admin-topic-dd-menu.open { display: block; }

  .selected-tags-display {
    display: flex; flex-wrap: wrap; gap: 5px;
    min-height: 26px; margin-top: 8px;
  }
  .sel-tag {
    background: var(--tag-bg); color: var(--tag-color);
    padding: 3px 8px; border-radius: 20px; font-size: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  .sel-tag .rm { cursor: pointer; font-size: 14px; line-height: 1; color: var(--blue); }

  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-secondary {
    background: #fff; color: var(--green);
    border: 1px solid var(--green);
    padding: 9px 18px; border-radius: 7px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Metropolis', sans-serif;
    transition: background .15s;
  }
  .btn-secondary:hover { background: #f0faf8; }
  .btn-danger {
    background: #fff; color: #dc2626;
    border: 1px solid #fca5a5;
    padding: 9px 18px; border-radius: 7px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Metropolis', sans-serif;
    transition: background .15s;
  }
  .btn-danger:hover { background: #fef2f2; }
  .msg { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-top: 8px; }
  .msg.success { background: #ecfdf5; color: #065f46; }
  .msg.error   { background: #fef2f2; color: #dc2626; }

  /* Resource list in admin */
  .resource-list { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; }
  .resource-item {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; background: #fafafa;
  }
  .resource-item-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .resource-item-title { font-size: 14px; font-weight: 600; }
  .resource-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ico-btn {
    padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border);
    background: #fff; font-size: 12px; cursor: pointer;
    font-family: 'Metropolis', sans-serif; transition: background .15s;
  }
  .ico-btn.edit-btn { color: var(--blue); border-color: #bfdbfe; }
  .ico-btn.edit-btn:hover { background: #eff6ff; }
  .ico-btn.del-btn { color: #dc2626; border-color: #fca5a5; }
  .ico-btn.del-btn:hover { background: #fef2f2; }
  .resource-item-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Tags panel */
  .tags-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tag-item {
    display: flex; align-items: center; gap: 6px;
    background: var(--tag-bg); color: var(--tag-color);
    padding: 5px 10px; border-radius: 20px; font-size: 13px;
  }
  .tag-del { cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; transition: color .15s; }
  .tag-del:hover { color: #dc2626; }
  .add-tag-row { display: flex; gap: 8px; }
  .add-tag-row input {
    flex: 1; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 14px; font-family: 'Metropolis', sans-serif; outline: none;
  }
  .add-tag-row input:focus { border-color: var(--green); }

  .admin-btn { display: none; }
  /* Change password */
  .change-pw { max-width: 340px; }

  /* Edit modal inside admin */
  .edit-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 2000;
    align-items: center; justify-content: center; padding: 20px;
  }
  .edit-overlay.open { display: flex; }
  .edit-modal {
    background: #fff; border-radius: 12px;
    width: 100%; max-width: 600px; max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .edit-modal .modal-head { border-radius: 12px 12px 0 0; }
  .edit-modal .modal-body { padding: 22px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Resource Library</h1>
    <p>Fact sheets &amp; webinars on gun violence prevention</p>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <input type="text" id="search-input" placeholder="Search resources…" oninput="renderPublic()">
  <div class="type-filter">
    <button class="type-btn active" data-type="all" onclick="setType('all',this)">All</button>
    <button class="type-btn" data-type="factsheet" onclick="setType('factsheet',this)">Fact Sheets</button>
    <button class="type-btn" data-type="webinar" onclick="setType('webinar',this)">Webinars</button>
  </div>
  <div class="topic-dropdown-wrap" id="pub-dd-wrap">
    <div class="topic-dropdown-btn" id="pub-dd-btn" onclick="togglePubDD()">
      <span id="pub-dd-label">Filter by topic</span>
      <span class="arrow">▼</span>
    </div>
    <div class="topic-dropdown-menu" id="pub-dd-menu"></div>
  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">
  <p class="results-count" id="results-count"></p>
  <div class="grid" id="pub-grid"></div>
</div>

<!-- ADMIN MODAL -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Admin Panel</h2>
      <button class="modal-close" onclick="closeAdmin()">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- login or panel renders here -->
    </div>
  </div>
</div>

<!-- EDIT RESOURCE MODAL -->
<div class="edit-overlay" id="edit-overlay">
  <div class="edit-modal">
    <div class="modal-head">
      <h2>Edit Resource</h2>
      <button class="modal-close" onclick="closeEdit()">✕</button>
    </div>
    <div class="modal-body" id="edit-body"></div>
  </div>
</div>

<script>
// ── STATE ──
const ADMIN_PW_KEY = 'rl_admin_pw';
let adminPw = localStorage.getItem(ADMIN_PW_KEY) || 'coalition2024';

let topics = [
  'domestic violence','community violence','mass shootings',
  'Emergency Response Orders','Police Shootings','Immigration',
  'suicide','firearm industry','youth','survivors','schools','policy','healthcare'
];

let resources = [
  {id:1,type:'factsheet',title:'Gun Violence in Massachusetts 101',topics:['policy'],desc:'An overview of gun violence statistics and context in Massachusetts.',url:'#'},
  {id:2,type:'factsheet',title:'About the Coalition',topics:['policy'],desc:'Learn about our coalition, mission, and the work we do to prevent gun violence.',url:'#'},
  {id:3,type:'factsheet',title:'Guns and Suicide',topics:['suicide'],desc:'Explores the connection between firearm access and suicide risk, with prevention strategies.',url:'#'},
  {id:4,type:'factsheet',title:'Guns and Domestic Violence',topics:['domestic violence'],desc:'Data and policy context on how firearms escalate danger in domestic violence situations.',url:'#'},
  {id:5,type:'factsheet',title:'Guns and Mass Shootings',topics:['mass shootings','policy'],desc:'Key facts on mass shooting incidents and related legislative responses.',url:'#'},
  {id:6,type:'factsheet',title:'Guns and Police Shootings',topics:['Police Shootings'],desc:'An examination of data and policy context around police-involved shootings.',url:'#'},
  {id:7,type:'factsheet',title:'Guns and Community Violence',topics:['community violence'],desc:'Community violence trends, impacts, and intervention strategies.',url:'#'},
  {id:8,type:'factsheet',title:'Guns and Emergency Response Orders',topics:['Emergency Response Orders'],desc:'A guide to Extreme Risk Protection Orders and how they work in Massachusetts.',url:'#'},
  {id:9,type:'factsheet',title:'The Intersection of Gun Violence, Immigration and Federal Agencies',topics:['Immigration','policy'],desc:'How immigration enforcement intersects with gun violence and public safety.',url:'#'},
  {id:10,type:'factsheet',title:'The Impact of Guns on Healthcare in Massachusetts',topics:['healthcare'],desc:'The burden of gun violence on the healthcare system in Massachusetts.',url:'#'},
  {id:11,type:'factsheet',title:'The Impact of Guns on Schools in Massachusetts',topics:['schools','youth'],desc:'How gun violence affects students, educators, and schools across Massachusetts.',url:'#'},
  {id:12,type:'factsheet',title:'The Impact of Guns on Businesses in Massachusetts',topics:['policy'],desc:'Economic and safety impacts of gun violence on businesses in the state.',url:'#'},
  {id:13,type:'webinar',title:'Why Young People Carry Guns',topics:['youth','community violence'],desc:'A deep dive into the social and economic factors that lead young people to carry firearms.',url:'#'},
  {id:14,type:'webinar',title:'The Intersection of Guns and Domestic Violence',topics:['domestic violence'],desc:'Expert conversation on how firearms increase lethality in domestic violence situations.',url:'#'},

let nextId = 26;
let currentType = 'all';
let selectedPubTopics = [];
let adminLoggedIn = false;
let adminTab = 'resources';
let editingId = null;
let editSelectedTopics = [];
let addSelectedTopics = [];

// ── PUBLIC DROPDOWN ──
function buildPubDD() {
  const menu = document.getElementById('pub-dd-menu');
  menu.innerHTML = topics.map(t => `
    <label class="topic-option${selectedPubTopics.includes(t)?' selected':''}" onclick="togglePubTopic('${t}',event)">
      <input type="checkbox" ${selectedPubTopics.includes(t)?'checked':''} onclick="event.stopPropagation()"> ${t}
    </label>
  `).join('') + `<span class="dd-clear" onclick="clearPubTopics()">Clear all</span>`;
}
function togglePubDD() {
  const btn = document.getElementById('pub-dd-btn');
  const menu = document.getElementById('pub-dd-menu');
  btn.classList.toggle('open');
  menu.classList.toggle('open');
  if (menu.classList.contains('open')) buildPubDD();
}
function togglePubTopic(t, e) {
  e && e.stopPropagation();
  if (selectedPubTopics.includes(t)) selectedPubTopics = selectedPubTopics.filter(x=>x!==t);
  else selectedPubTopics.push(t);
  buildPubDD();
  updatePubDDLabel();
  renderPublic();
}
function clearPubTopics() {
  selectedPubTopics = [];
  buildPubDD();
  updatePubDDLabel();
  renderPublic();
}
function updatePubDDLabel() {
  const lbl = document.getElementById('pub-dd-label');
  lbl.textContent = selectedPubTopics.length
    ? selectedPubTopics.length === 1 ? selectedPubTopics[0] : `${selectedPubTopics.length} topics selected`
    : 'Filter by topic';
}
document.addEventListener('click', e => {
  const wrap = document.getElementById('pub-dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('pub-dd-btn').classList.remove('open');
    document.getElementById('pub-dd-menu').classList.remove('open');
  }
});

function setType(t, el) {
  currentType = t;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderPublic();
}

// ── RENDER PUBLIC ──
function renderPublic() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let filtered = resources.filter(r => {
    if (currentType !== 'all' && r.type !== currentType) return false;
    if (selectedPubTopics.length && !selectedPubTopics.some(t => r.topics.includes(t))) return false;
    if (q && !r.title.toLowerCase().includes(q) && !r.desc.toLowerCase().includes(q) && !r.topics.some(t=>t.toLowerCase().includes(q))) return false;
    return true;
  });
  const grid = document.getElementById('pub-grid');
  const count = document.getElementById('results-count');
  count.textContent = `${filtered.length} resource${filtered.length!==1?'s':''} found`;
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state"><h3>No resources found</h3><p>Try adjusting your search or filters.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map(r => {
    const isVid = r.type === 'webinar';
    const tagsHtml = r.topics.map(t=>`<span class="tag" onclick="filterByTag('${t}')">${t}</span>`).join('');
    const hasDesc = r.desc && r.desc.trim();
    const descHtml = hasDesc ? `
      <div class="card-desc-wrap">
        <div class="card-desc-text" id="desc-${r.id}">${r.desc}</div>
        <button class="expand-btn" id="exp-${r.id}" onclick="toggleDesc(${r.id})">Show more</button>
      </div>` : '';
    const linkClass = r.url && r.url !== '#' ? (isVid ? 'vid-l' : 'pdf-l') : 'no-link';
    const linkText = isVid ? '▶ Watch Webinar' : '↓ View PDF';
    const linkHtml = r.url && r.url !== '#'
      ? `<div class="card-url-wrap">
           <span class="card-url-label">${isVid ? '▶ Webinar' : '↓ PDF'}:</span>
           <a class="card-url" href="${r.url}">${r.url}</a>
           <button class="copy-btn" onclick="copyUrl('${r.url}', this)">Copy</button>
         </div>`
      : `<span class="card-link no-link">${isVid ? '▶ Watch Webinar' : '↓ View PDF'}</span>`;
    return `<div class="card">
      <div class="card-header">
        <div class="card-title">${r.title}</div>
        <span class="card-type type-${r.type}">${r.type === 'webinar' ? 'Webinar' : 'Fact Sheet'}</span>
      </div>
      ${r.topics.length ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      ${descHtml}
      ${linkHtml}
    </div>`;
  }).join('');
}

function filterByTag(t) {
  if (!selectedPubTopics.includes(t)) { selectedPubTopics.push(t); updatePubDDLabel(); buildPubDD(); renderPublic(); }
}

function toggleDesc(id) {
  const el = document.getElementById('desc-'+id);
  const btn = document.getElementById('exp-'+id);
  if (!el) return;
  el.classList.toggle('expanded');
  btn.textContent = el.classList.contains('expanded') ? 'Show less' : 'Show more';
}

// ── ADMIN ──
function openAdmin() {
  document.getElementById('admin-modal').classList.add('open');
  adminLoggedIn ? renderAdminPanel() : renderLogin();
}
function closeAdmin() {
  document.getElementById('admin-modal').classList.remove('open');
}

function renderLogin() {
  document.getElementById('modal-title').textContent = 'Admin Login';
  document.getElementById('modal-body').innerHTML = `
    <div class="login-box">
      <p>Enter the admin password to manage resources and topics.</p>
      <p class="login-err" id="login-err"></p>
      <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>`;
  setTimeout(()=>{ const el = document.getElementById('pw-input'); if(el) el.focus(); }, 50);
}

function doLogin() {
  const val = document.getElementById('pw-input').value;
  if (val === adminPw) {
    adminLoggedIn = true;
    renderAdminPanel();
  } else {
    document.getElementById('login-err').textContent = 'Incorrect password.';
  }
}

function renderAdminPanel() {
  document.getElementById('modal-title').textContent = 'Admin Panel';
  document.getElementById('modal-body').innerHTML = `
    <div class="admin-tabs">
      <button class="admin-tab${adminTab==='resources'?' active':''}" onclick="switchTab('resources')">Resources</button>
      <button class="admin-tab${adminTab==='add'?' active':''}" onclick="switchTab('add')">Add Resource</button>
      <button class="admin-tab${adminTab==='tags'?' active':''}" onclick="switchTab('tags')">Manage Tags</button>
      <button class="admin-tab${adminTab==='settings'?' active':''}" onclick="switchTab('settings')">Settings</button>
    </div>
    <div id="admin-content"></div>`;
  renderAdminTab();
}

function switchTab(t) {
  adminTab = t;
  document.querySelectorAll('.admin-tab').forEach(el => el.classList.toggle('active', el.textContent.toLowerCase().replace(' ','') === t.toLowerCase().replace(' ','')));
  // re-match by tab name
  document.querySelectorAll('.admin-tab').forEach(el => {
    const map = {Resources:'resources','Add Resource':'add','Manage Tags':'tags',Settings:'settings'};
    el.classList.toggle('active', map[el.textContent] === t);
  });
  renderAdminTab();
}

function renderAdminTab() {
  const c = document.getElementById('admin-content');
  if (!c) return;
  if (adminTab === 'resources') renderAdminResources(c);
  else if (adminTab === 'add') renderAdminAdd(c);
  else if (adminTab === 'tags') renderAdminTags(c);
  else if (adminTab === 'settings') renderAdminSettings(c);
}

// ── RESOURCES TAB ──
function renderAdminResources(c) {
  c.innerHTML = `
    <div class="admin-section">
      <h3>All Resources (${resources.length})</h3>
      <div class="resource-list">${resources.map(r=>`
        <div class="resource-item">
          <div class="resource-item-header">
            <div class="resource-item-title">${r.title}</div>
            <div class="resource-item-actions">
              <button class="ico-btn edit-btn" onclick="openEdit(${r.id})">Edit</button>
              <button class="ico-btn del-btn" onclick="deleteResource(${r.id})">Delete</button>
            </div>
          </div>
          <div class="resource-item-meta">${r.type==='webinar'?'Webinar':'Fact Sheet'} · ${r.topics.join(', ')||'No tags'} · <a href="${r.url}" target="_top" style="color:var(--blue)">${r.url==='#'?'No URL set':'Link →'}</a></div>
        </div>`).join('')}
      </div>
    </div>`;
}

function deleteResource(id) {
  if (!confirm('Delete this resource?')) return;
  resources = resources.filter(r=>r.id!==id);
  renderPublic();
  renderAdminTab();
}

// ── ADD RESOURCE TAB ──
function renderAdminAdd(c) {
  addSelectedTopics = [];
  c.innerHTML = `
    <div class="admin-section">
      <h3>Add New Resource</h3>
      <div class="form-row"><label>Title</label><input type="text" id="add-title" placeholder="Resource title"></div>
      <div class="form-2col">
        <div class="form-row"><label>Type</label>
          <select id="add-type">
            <option value="factsheet">Fact Sheet</option>
            <option value="webinar">Webinar</option>
          </select>
        </div>
        <div class="form-row"><label>URL</label><input type="url" id="add-url" placeholder="https://…"></div>
      </div>
      <div class="form-row"><label>Description</label><textarea id="add-desc" placeholder="Brief description of this resource…"></textarea></div>
      <div class="form-row">
        <label>Topics</label>
        <div class="admin-topic-dd-wrap" id="add-dd-wrap">
          <div class="admin-topic-dd-btn" id="add-dd-btn" onclick="toggleAddDD()">
            <span id="add-dd-label">Select topics…</span><span class="arrow">▼</span>
          </div>
          <div class="admin-topic-dd-menu" id="add-dd-menu"></div>
        </div>
        <div class="selected-tags-display" id="add-tags-display"></div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="doAddResource()" style="width:auto;padding:9px 24px">Add Resource</button>
      </div>
      <div id="add-msg"></div>
    </div>`;
  buildAddDD();
}

function buildAddDD() {
  const menu = document.getElementById('add-dd-menu');
  if (!menu) return;
  menu.innerHTML = topics.map(t=>`
    <label class="topic-option${addSelectedTopics.includes(t)?' selected':''}" onclick="toggleAddTopic('${t}',event)">
      <input type="checkbox" ${addSelectedTopics.includes(t)?'checked':''} onclick="event.stopPropagation()"> ${t}
    </label>`).join('') + `<span class="dd-clear" onclick="clearAddTopics()">Clear all</span>`;
  renderAddTagsDisplay();
}
function toggleAddDD() {
  const btn = document.getElementById('add-dd-btn');
  const menu = document.getElementById('add-dd-menu');
  if (!btn||!menu) return;
  btn.classList.toggle('open'); menu.classList.toggle('open');
}
function toggleAddTopic(t, e) {
  e && e.stopPropagation();
  if (addSelectedTopics.includes(t)) addSelectedTopics = addSelectedTopics.filter(x=>x!==t);
  else addSelectedTopics.push(t);
  buildAddDD();
}
function clearAddTopics() { addSelectedTopics = []; buildAddDD(); }
function renderAddTagsDisplay() {
  const d = document.getElementById('add-tags-display'); if (!d) return;
  d.innerHTML = addSelectedTopics.map(t=>`<span class="sel-tag">${t}<span class="rm" onclick="toggleAddTopic('${t}',event)">×</span></span>`).join('');
  const lbl = document.getElementById('add-dd-label');
  if (lbl) lbl.textContent = addSelectedTopics.length ? `${addSelectedTopics.length} selected` : 'Select topics…';
}
document.addEventListener('click', e => {
  const wrap = document.getElementById('add-dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const btn = document.getElementById('add-dd-btn'); const menu = document.getElementById('add-dd-menu');
    if (btn) btn.classList.remove('open'); if (menu) menu.classList.remove('open');
  }
});

function doAddResource() {
  const title = document.getElementById('add-title')?.value.trim();
  const type  = document.getElementById('add-type')?.value;
  const url   = document.getElementById('add-url')?.value.trim() || '#';
  const desc  = document.getElementById('add-desc')?.value.trim();
  const msgEl = document.getElementById('add-msg');
  if (!title) { msgEl.innerHTML = `<div class="msg error">Please enter a title.</div>`; return; }
  resources.push({id: nextId++, type, title, topics: [...addSelectedTopics], url, desc});
  renderPublic();
  msgEl.innerHTML = `<div class="msg success">Resource added successfully!</div>`;
  document.getElementById('add-title').value = '';
  document.getElementById('add-url').value = '';
  document.getElementById('add-desc').value = '';
  addSelectedTopics = [];
  buildAddDD();
  setTimeout(()=>{ if(msgEl) msgEl.innerHTML=''; }, 3000);
}

// ── EDIT RESOURCE ──
function openEdit(id) {
  const r = resources.find(r=>r.id===id);
  if (!r) return;
  editingId = id;
  editSelectedTopics = [...r.topics];
  const body = document.getElementById('edit-body');
  body.innerHTML = `
    <div class="form-row"><label>Title</label><input type="text" id="edit-title" value="${r.title}"></div>
    <div class="form-2col">
      <div class="form-row"><label>Type</label>
        <select id="edit-type">
          <option value="factsheet"${r.type==='factsheet'?' selected':''}>Fact Sheet</option>
          <option value="webinar"${r.type==='webinar'?' selected':''}>Webinar</option>
        </select>
      </div>
      <div class="form-row"><label>URL</label><input type="url" id="edit-url" value="${r.url==='#'?'':r.url}" placeholder="https://…"></div>
    </div>
    <div class="form-row"><label>Description</label><textarea id="edit-desc">${r.desc||''}</textarea></div>
    <div class="form-row">
      <label>Topics</label>
      <div class="admin-topic-dd-wrap" id="edit-dd-wrap">
        <div class="admin-topic-dd-btn" id="edit-dd-btn" onclick="toggleEditDD()">
          <span id="edit-dd-label">${editSelectedTopics.length?editSelectedTopics.length+' selected':'Select topics…'}</span><span class="arrow">▼</span>
        </div>
        <div class="admin-topic-dd-menu" id="edit-dd-menu"></div>
      </div>
      <div class="selected-tags-display" id="edit-tags-display"></div>
    </div>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveEdit()" style="width:auto;padding:9px 24px">Save Changes</button>
      <button class="btn-secondary" onclick="closeEdit()">Cancel</button>
    </div>
    <div id="edit-msg"></div>`;
  buildEditDD();
  document.getElementById('edit-overlay').classList.add('open');
}
function closeEdit() { document.getElementById('edit-overlay').classList.remove('open'); editingId=null; }

function buildEditDD() {
  const menu = document.getElementById('edit-dd-menu'); if (!menu) return;
  menu.innerHTML = topics.map(t=>`
    <label class="topic-option${editSelectedTopics.includes(t)?' selected':''}" onclick="toggleEditTopic('${t}',event)">
      <input type="checkbox" ${editSelectedTopics.includes(t)?'checked':''} onclick="event.stopPropagation()"> ${t}
    </label>`).join('') + `<span class="dd-clear" onclick="clearEditTopics()">Clear all</span>`;
  renderEditTagsDisplay();
}
function toggleEditDD() {
  const btn = document.getElementById('edit-dd-btn'); const menu = document.getElementById('edit-dd-menu');
  if (!btn||!menu) return;
  btn.classList.toggle('open'); menu.classList.toggle('open');
}
function toggleEditTopic(t, e) {
  e && e.stopPropagation();
  if (editSelectedTopics.includes(t)) editSelectedTopics = editSelectedTopics.filter(x=>x!==t);
  else editSelectedTopics.push(t);
  buildEditDD();
}
function clearEditTopics() { editSelectedTopics = []; buildEditDD(); }
function renderEditTagsDisplay() {
  const d = document.getElementById('edit-tags-display'); if (!d) return;
  d.innerHTML = editSelectedTopics.map(t=>`<span class="sel-tag">${t}<span class="rm" onclick="toggleEditTopic('${t}',event)">×</span></span>`).join('');
  const lbl = document.getElementById('edit-dd-label');
  if (lbl) lbl.textContent = editSelectedTopics.length ? `${editSelectedTopics.length} selected` : 'Select topics…';
}
document.addEventListener('click', e => {
  const wrap = document.getElementById('edit-dd-wrap');
  if (wrap && !wrap.contains(e.target)) {
    const btn = document.getElementById('edit-dd-btn'); const menu = document.getElementById('edit-dd-menu');
    if (btn) btn.classList.remove('open'); if (menu) menu.classList.remove('open');
  }
});
function saveEdit() {
  const r = resources.find(r=>r.id===editingId); if (!r) return;
  const title = document.getElementById('edit-title')?.value.trim();
  if (!title) { document.getElementById('edit-msg').innerHTML=`<div class="msg error">Title is required.</div>`; return; }
  r.title = title;
  r.type  = document.getElementById('edit-type').value;
  r.url   = document.getElementById('edit-url')?.value.trim() || '#';
  r.desc  = document.getElementById('edit-desc')?.value.trim();
  r.topics = [...editSelectedTopics];
  closeEdit();
  renderPublic();
  if (adminTab === 'resources') renderAdminTab();
}

// ── TAGS TAB ──
function renderAdminTags(c) {
  c.innerHTML = `
    <div class="admin-section">
      <h3>Current Tags</h3>
      <div class="tags-grid">${topics.map(t=>`
        <div class="tag-item">
          <span>${t}</span>
          <span class="tag-del" onclick="deleteTag('${t}')">×</span>
        </div>`).join('')}
      </div>
      <h3>Add New Tag</h3>
      <div class="add-tag-row">
        <input type="text" id="new-tag-input" placeholder="New topic tag…" onkeydown="if(event.key==='Enter')doAddTag()">
        <button class="btn-primary" onclick="doAddTag()" style="width:auto;padding:9px 20px">Add Tag</button>
      </div>
      <div id="tag-msg"></div>
    </div>`;
}
function deleteTag(t) {
  if (!confirm(`Remove tag "${t}"? It will also be removed from all resources.`)) return;
  topics = topics.filter(x=>x!==t);
  resources.forEach(r => { r.topics = r.topics.filter(x=>x!==t); });
  renderPublic();
  renderAdminTab();
}
function doAddTag() {
  const input = document.getElementById('new-tag-input');
  const val = input?.value.trim();
  const msgEl = document.getElementById('tag-msg');
  if (!val) return;
  if (topics.map(t=>t.toLowerCase()).includes(val.toLowerCase())) {
    msgEl.innerHTML=`<div class="msg error">Tag already exists.</div>`; return;
  }
  topics.push(val); input.value='';
  renderPublic();
  renderAdminTab();
  setTimeout(()=>{ if(msgEl) msgEl.innerHTML=''; }, 2500);
}

// ── SETTINGS TAB ──
function renderAdminSettings(c) {
  c.innerHTML = `
    <div class="admin-section">
      <h3>Change Admin Password</h3>
      <div class="change-pw">
        <div class="form-row"><label>Current Password</label><input type="password" id="cur-pw"></div>
        <div class="form-row"><label>New Password</label><input type="password" id="new-pw"></div>
        <div class="form-row"><label>Confirm New Password</label><input type="password" id="conf-pw"></div>
        <div class="form-actions"><button class="btn-primary" onclick="changePw()" style="width:auto;padding:9px 20px">Update Password</button></div>
        <div id="pw-msg"></div>
      </div>
      <div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--border)">
        <button class="btn-secondary" onclick="doLogout()">Log Out</button>
      </div>
    </div>`;
}
function changePw() {
  const cur = document.getElementById('cur-pw')?.value;
  const nw  = document.getElementById('new-pw')?.value;
  const cf  = document.getElementById('conf-pw')?.value;
  const msgEl = document.getElementById('pw-msg');
  if (cur !== adminPw) { msgEl.innerHTML=`<div class="msg error">Current password is incorrect.</div>`; return; }
  if (!nw || nw.length < 6) { msgEl.innerHTML=`<div class="msg error">New password must be at least 6 characters.</div>`; return; }
  if (nw !== cf) { msgEl.innerHTML=`<div class="msg error">Passwords do not match.</div>`; return; }
  adminPw = nw;
  localStorage.setItem(ADMIN_PW_KEY, nw);
  msgEl.innerHTML=`<div class="msg success">Password updated!</div>`;
  setTimeout(()=>{ if(msgEl) msgEl.innerHTML=''; }, 3000);
}
function doLogout() { adminLoggedIn=false; closeAdmin(); }

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {
    btn.textContent = 'Copy failed';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  });
}

// ── INIT ──
function openLink(url) {
  if (!url || url === '#') return;
  window.open(url, '_blank', 'noopener,noreferrer');
}
renderPublic();
</script>
